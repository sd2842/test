<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音声議事録アプリ</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* モダンなスタイル設定 */
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
            margin: 20px;
        }
        h1 {
            color: #4a5568;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 700;
            font-size: 2.5rem;
        }
        .status {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 500;
            color: #1976d2;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 500;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-family: 'Noto Sans JP', sans-serif;
        }
        #startBtn {
            background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
            color: white;
        }
        #startBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }
        #stopBtn {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            color: white;
        }
        #stopBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(244, 67, 54, 0.4);
        }
        #clearBtn {
            background: linear-gradient(135deg, #9c27b0 0%, #7b1fa2 100%);
            color: white;
        }
        #clearBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(156, 39, 176, 0.4);
        }
        #saveBtn {
            background: linear-gradient(135deg, #1976d2 0%, #1565c0 100%);
            color: white;
        }
        #saveBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(25, 118, 210, 0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        select {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            background: #f8f9fa;
            color: #495057;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-family: 'Noto Sans JP', sans-serif;
        }
        select:focus {
            outline: none;
            box-shadow: 0 4px 15px rgba(25, 118, 210, 0.3);
        }
        #transcript {
            width: 100%;
            height: 300px;
            padding: 20px;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            font-size: 16px;
            line-height: 1.6;
            resize: vertical;
            background: #f8f9fa;
            color: #495057;
            font-family: 'Noto Sans JP', sans-serif;
            transition: border-color 0.3s ease;
        }
        #transcript:focus {
            outline: none;
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
        }
        .timestamp {
            color: #6c757d;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 音声議事録アプリ</h1>
        
        <div class="status" id="status">準備完了</div>
        
        <div class="controls">
            <button id="startBtn">開始</button> <!-- 音声認識を開始するボタン -->
            <button id="stopBtn" disabled>停止</button> <!-- 音声認識を停止するボタン -->
            <button id="clearBtn">クリア</button> <!-- テキストエリアをクリアするボタン -->
            <button id="saveBtn" disabled>保存</button> <!-- テキストを保存するボタン -->
            <select id="language"> <!-- 言語選択ドロップダウン -->
                <option value="ja-JP">日本語</option>
                <option value="en-US">英語</option>
            </select>
        </div>
        
        <textarea id="transcript" placeholder="音声が認識されここに表示されます..."></textarea> <!-- 認識された音声を表示するテキストエリア -->
    </div>

    <script>
        // 音声認識オブジェクトの作成
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');
        const saveBtn = document.getElementById('saveBtn');
        const status = document.getElementById('status');
        const transcript = document.getElementById('transcript');
        const languageSelect = document.getElementById('language');
        let isListening = false; // リスニング状態を管理するフラグ

        recognition.continuous = true; // 継続的な音声認識を有効にする
        recognition.interimResults = true; // 中間結果を取得する

        // 開始ボタンのクリックイベント
        startBtn.addEventListener('click', () => {
            isListening = true; // リスニング状態をtrueに設定
            recognition.lang = languageSelect.value; // 選択された言語を設定
            recognition.start(); // 音声認識を開始
            startBtn.disabled = true; // 開始ボタンを無効化
            stopBtn.disabled = false; // 停止ボタンを有効化
            status.textContent = '🎤 リッスン中...'; // ステータスを更新
        });

        // 停止ボタンのクリックイベント
        stopBtn.addEventListener('click', () => {
            isListening = false; // リスニング状態をfalseに設定
            recognition.stop(); // 音声認識を停止
            startBtn.disabled = false; // 開始ボタンを有効化
            stopBtn.disabled = true; // 停止ボタンを無効化
            status.textContent = '停止しました'; // ステータスを更新
        });

        // クリアボタンのクリックイベント
        clearBtn.addEventListener('click', () => {
            transcript.value = ''; // テキストエリアをクリア
            saveBtn.disabled = true;
            status.textContent = 'クリアしました'; // ステータスを更新
        });

        // 音声認識結果の処理
        recognition.onresult = (event) => {
            let interimTranscript = ''; // 中間結果を格納する変数
            for (let i = event.resultIndex; i < event.results.length; i++) {
                const transcriptSegment = event.results[i][0].transcript; // 認識されたテキスト
                if (event.results[i].isFinal) {
                    transcript.value += transcriptSegment + '\n'; // 最終結果をテキストエリアに追加
                } else {
                    interimTranscript += transcriptSegment; // 中間結果を追加
                }
            }
            if (interimTranscript) {
                status.textContent = '認識中: ' + interimTranscript; // ステータスを更新
            }
        };

        // エラー処理
        recognition.onerror = (event) => {
            status.textContent = 'エラー: ' + event.error; // エラーメッセージを表示
            // リスニング中の場合は自動的に再開
            if (isListening) {
                setTimeout(() => {
                    recognition.start();
                }, 100);
            }
        };

        // 音声認識が終了したときの処理
        recognition.onend = () => {
            // リスニング中の場合は自動的に再開
            if (isListening) {
                recognition.start();
            } else {
                startBtn.disabled = false; // 開始ボタンを有効化
                stopBtn.disabled = true; // 停止ボタンを無効化
                status.textContent = '準備完了'; // ステータスを更新
            }
        };

        // 保存ボタンの有効化（テキストがあるとき）
        transcript.addEventListener('input', () => {
            saveBtn.disabled = transcript.value.trim() === '';
        });

        // 保存ボタンのクリックイベント（テキストをファイルとしてダウンロード）
        saveBtn.addEventListener('click', () => {
            const text = transcript.value.trim();
            if (!text) return;
            const now = new Date();
            const pad = (n) => n.toString().padStart(2, '0');
            const filename = `minutes_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.txt`;
            const header = `議事録 （保存日時: ${now.toLocaleString()}）\n言語: ${languageSelect.value}\n\n`;
            const blob = new Blob([header, text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            status.textContent = `保存しました: ${filename}`;
        });

        // Ctrl/Cmd+Sで保存
        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                if (!saveBtn.disabled) {
                    e.preventDefault();
                    saveBtn.click();
                }
            }
        });
    </script>
</body>
</html>
